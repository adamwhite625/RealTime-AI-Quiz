spring.application.name=quizmaster
server.port=${SERVER_PORT:8080}

# Import .env file if present
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:quizmaster}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak Configuration
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:quizmaster-realm}
keycloak.resource=${KEYCLOAK_CLIENT_ID:quizmaster-client}
keycloak.credentials.secret=${KEYCLOAK_CLIENT_SECRET:qXJB6bYWTjCrrwYdOY2JLUn3Va7WWTft}

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}
